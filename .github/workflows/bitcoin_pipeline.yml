name: Bitcoin Data Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # tiap jam

permissions:
  contents: write

jobs:
  bitcoin_pipeline:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
      MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r project/requirements.txt
        
      - name: Pull data from DVC
        working-directory: project
        run: |
          export AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID:-$MINIO_ACCESS_KEY}"
          export AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY:-$MINIO_SECRET_KEY}"

          dvc pull

      - name: Run Bitcoin Data Pipeline
        run: |
          python project/src/run_pipeline.py

      - name: Push changes to DVC
        working-directory: project
        run: |
          export AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID:-$MINIO_ACCESS_KEY}"
          export AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY:-$MINIO_SECRET_KEY}"

          dvc commit --force
          dvc push

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw.dvc data/processed/*.dvc
          if ! git diff --cached --quiet; then
            git commit -m "chore: update DVC data pointers"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
