services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.0
    networks:
      - bitcoin-network
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////data/mlflow.db
      - --default-artifact-root
      - /data/mlartifacts
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow.db:/data/mlflow.db
      - ./mlartifacts:/data/mlartifacts

  api:
    build:
      context: .
      dockerfile: inference/Dockerfile
    networks:
      - bitcoin-network
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8000:8000"
    depends_on:
      - mlflow

networks:
  bitcoin-network:
    driver: bridge