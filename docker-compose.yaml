services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.0
    networks:
      - bitcoin-network
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////data/mlflow.db
      - --serve-artifacts
      - --artifacts-destination
      - /data/mlartifacts
      - --allowed-hosts
      - "host.docker.internal:5000,mlflow:5000,localhost:5000,127.0.0.1:5000"
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow.db:/data/mlflow.db
      - ./mlartifacts:/data/mlartifacts

  api:
    build:
      context: .
      dockerfile: inference/Dockerfile
    networks:
      - bitcoin-network
    extra_hosts:
    - "host.docker.internal:host-gateway"
    environment:
      MLFLOW_TRACKING_URI: http://host.docker.internal:5000
    ports:
      - "8000:8000"
    depends_on:
      - mlflow

networks:
  bitcoin-network:
    driver: bridge